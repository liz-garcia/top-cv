# This workflow will do code style checks for the Server
name: Server Code Style (Spotless, Checkstyle)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the code
    - uses: actions/checkout@v3

    # Step 2: Set up Java
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin' # Use the Eclipse Temurin JDK
        java-version: '17' # Match the version in your Gradle build file
        cache: 'gradle'

    # Step 3: Run Gradle build to check code style
    - name: Run code style checks
      run: ./gradlew spotlessCheck checkstyleMain
